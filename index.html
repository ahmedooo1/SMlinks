<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روابطي المميزة</title>
    <!-- خط تجريدي حديث -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-glow: #7928ca;
            --secondary-glow: #ff0080;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية نيون متوهجة متحرّكة */
        .glow-bg {
            position: absolute;
            width: 350px;
            height: 350px;
            background: linear-gradient(45deg, var(--primary-glow), var(--secondary-glow));
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            animation: pulse 8s infinite alternate;
            z-index: 0;
        }

        @keyframes pulse {
            0% { transform: translate(-30%, -30%) scale(1); }
            100% { transform: translate(30%, 30%) scale(1.2); }
        }

        /* الحاوية الرئيسية */
        .container {
            width: 100%;
            max-width: 480px;
            padding: 2.5rem 1.5rem;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* الصورة الشخصية مع هالة نيون */
        .profile-wrapper {
            position: relative;
            margin-bottom: 1.2rem;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 25px rgba(255, 0, 128, 0.4);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .profile-wrapper:hover .avatar {
            transform: scale(1.08) rotate(-3deg);
        }

        /* الاسم والبايو */
        .name {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(to right, #fff, #a5a5a5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.4rem;
        }

        .bio {
            font-size: 0.95rem;
            color: #b3b3b3;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.8rem 1.2rem;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
        }

        /* قائمة الروابط */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .link-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* تأثير إضاءة عند التمرير فوق الرابط */
        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.6s ease;
        }

        .link-card:hover::before {
            left: 100%;
        }

        .link-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px -10px rgba(121, 40, 202, 0.5);
            background: rgba(255, 255, 255, 0.07);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .link-icon {
            font-size: 1.4rem;
            width: 30px;
            text-align: center;
            background: linear-gradient(45deg, #ff0080, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .link-title {
            font-weight: 700;
            font-size: 1rem;
        }

        .arrow-icon {
            font-size: 0.8rem;
            opacity: 0.5;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .link-card:hover .arrow-icon {
            opacity: 1;
            transform: translateX(-5px);
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="container">
        <!-- الصورة الشخصية -->
        <div class="profile-wrapper">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Profile" class="avatar">
        </div>

        <!-- الاسم -->
        <h1 class="name">اسمك هنا</h1>

        <!-- البايو الإبداعي -->
        <p class="bio">✨ أصنع أفكاراً تتجاوز حدود المألوف | مصمم ومطور تجارب رقمية بسيطة بلمسة إبداعية 🚀</p>

        <!-- الروابط -->
        <div class="links-container">

            <a href="https://instagram.com" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fa-brands fa-instagram link-icon"></i>
                    <span class="link-title">إنستغرام | معرض أعمالي</span>
                </div>
                <i class="fa-solid fa-arrow-left arrow-icon"></i>
            </a>

            <a href="https://youtube.com" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fa-brands fa-youtube link-icon"></i>
                    <span class="link-title">قناة اليوتيوب</span>
                </div>
                <i class="fa-solid fa-arrow-left arrow-icon"></i>
            </a>

            <a href="https://github.com" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fa-brands fa-github link-icon"></i>
                    <span class="link-title">مشاريع المطورين (GitHub)</span>
                </div>
                <i class="fa-solid fa-arrow-left arrow-icon"></i>
            </a>

            <a href="https://wa.me/" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fa-brands fa-whatsapp link-icon"></i>
                    <span class="link-title">تواصل معي عبر واتساب</span>
                </div>
                <i class="fa-solid fa-arrow-left arrow-icon"></i>
            </a>

        </div>
    </div>

    <!-- تأثير 3D خفيف يتفاعل مع الماوس -->
    <script>
        const cards = document.querySelectorAll('.link-card');
        
        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                
                card.style.transform = `perspective(1000px) rotateX(${-y / 10}deg) rotateY(${x / 10}deg) translateY(-4px)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)';
            });
        });
    </script>
</body>
</html>
